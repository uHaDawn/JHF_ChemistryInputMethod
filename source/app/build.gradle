plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jhf.jiehuafa'
    compileSdk 34

    defaultConfig {
        applicationId "com.jhf.jiehuafa"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 纯 framework API 实现，无第三方依赖
dependencies {
}
